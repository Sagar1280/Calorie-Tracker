name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            cd "${{ vars.DEPLOY_PATH }}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            if docker compose ps --status running --services | grep -qx db; then
              sh ./deploy/backup_postgres.sh
            fi
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            image_repository="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
            export APP_IMAGE="ghcr.io/${image_repository}:sha-${{ github.event.workflow_run.head_sha }}"
            docker compose pull app
            docker compose up -d --no-build --remove-orphans
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS "http://127.0.0.1/api/health" >/dev/null; then
                exit 0
              fi
              sleep 5
            done
            docker compose ps
            docker compose logs --tail=100 app
            exit 1
